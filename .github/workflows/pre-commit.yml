# The same checks as the local pre-commit hooks, on every PR and push to main,
# so a commit made without the hooks installed can't reach main unchecked.
name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# npm's audit is a POST, which http-filter refuses on the read-only registry.
env:
  npm_config_audit: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # First, so its pre step locks down egress before any other step runs.
      - uses: portswigger-tim/safer-runner-action@d9772c3c7c5c0f8cd6cb7123e138120b11c12371 # v2.2.1
        with:
          mode: enforce
          # Comments go here, never inside the block below: the action reads
          # every word in it as a domain.
          # gitleaks is a Go hook: pre-commit builds it from module downloads.
          allowed-domains: |
            pypi.org
            files.pythonhosted.org
            registry.npmjs.org
            proxy.golang.org
            storage.googleapis.com
          # Read-only: installs and clones yes, publishes and pushes no. git
          # fetches are a POST to git-upload-pack; pushes (git-receive-pack) fall
          # through to the GET/HEAD rule and are refused.
          http-filter: |
            github.com:
              "*": GET, HEAD
              "*/git-upload-pack": POST
            api.github.com:
              "*": GET, HEAD
            release-assets.githubusercontent.com:
              "*": GET, HEAD
            registry.npmjs.org:
              "*": GET, HEAD
            pypi.org:
              "*": GET, HEAD
            files.pythonhosted.org:
              "*": GET, HEAD
            proxy.golang.org:
              "*": GET, HEAD
            storage.googleapis.com:
              "*": GET, HEAD
          docker: remove-group
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install pre-commit==4.7.0
      - run: pre-commit run --all-files --show-diff-on-failure --color=always
