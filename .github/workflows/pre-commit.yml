# The same checks as the local pre-commit hooks, on every PR and push to main,
# so a commit made without the hooks installed can't reach main unchecked.
name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # First, so its pre step locks down egress before any other step runs.
      - uses: portswigger-tim/safer-runner-action@6da27de7c0c90d2bb3174f56ee65a5eb9eb72867 # v2.0.0
        with:
          mode: enforce
          allowed-domains: |
            pypi.org
            files.pythonhosted.org
            registry.npmjs.org
          docker: remove-group
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install pre-commit==4.7.0
      - run: pre-commit run --all-files --show-diff-on-failure --color=always
